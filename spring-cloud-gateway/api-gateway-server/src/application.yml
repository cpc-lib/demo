eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: api-gateway-server
  cloud:
    # 网关配置
    gateway:
      # 路由配置：转发规则
      routes: #集合。
        # id: 唯一标识。默认是一个UUID
        # uri: 转发路径
        # predicates: 条件,用于请求网关路径的匹配规则
        # filters：配置局部过滤器的
        - id: gateway-provider
          # 静态路由
          # uri: http://localhost:8001/
          # 动态路由
          uri: lb://GATEWAY-PROVIDER
          predicates:
            - Path=/goods/**,/gateway-provider/goods/**
          filters:
            #局部过滤器
            - AddRequestParameter=username,zhangsan
            - StripPrefix=0
        - id: gateway-consumer
          # uri: http://localhost:9000
          uri: lb://GATEWAY-CONSUMER
          predicates:
            - Path=/order/**
          # 微服务名称配置
      discovery:
        locator:
          enabled: true # 设置为true 请求路径前可以添加微服务名称
          lower-case-service-id: true # 允许为小写
#https://blog.csdn.net/whq12789/article/details/85336282
#StripPrefix的数值代表移除前缀的个数