<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
</head>
<body>
<h1>File Upload</h1>
<input type="file" id="fileInput"/>
<button onclick="uploadFile()">Upload File</button>
<script>
    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) {
            alert('Please select a file to upload.');
            return;
        }

        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = function (e) {
            const md5Hash = SparkMD5.ArrayBuffer.hash(e.target.result);
            const chunkSize = 2 * 1024 * 1024; // 1MB per chunk
            const totalChunks = Math.ceil(file.size / chunkSize);
            let currentChunk = 0;

            const uploadChunk = () => {
                const start = currentChunk * chunkSize;
                const end = Math.min(start + chunkSize, file.size);
                const blob = file.slice(start, end);
                const formData = new FormData();
                formData.append('identifier', md5Hash); // Use MD5 hash as identifier
                formData.append('file', blob);
                formData.append('chunkNumber', currentChunk + 10000);
                formData.append('chunkSize', chunkSize);
                formData.append("currentChunkSize", blob.size)
                formData.append('totalSize', file.size);
                formData.append('totalChunks', totalChunks);
                formData.append('filename', file.name);


                // console.log(createCheckUrl("http://localhost:8989/upload/chunk", {
                //         identifier: md5Hash,
                //         chunkNumber: currentChunk + 10000,
                //         chunkSize: chunkSize,
                //         currentChunkSize: blob.size,
                //         totalSize: file.size,
                //         totalChunks: totalChunks,
                //         filename: file.name
                //     })
                // )


                axios.get(createCheckUrl("http://localhost:8989/upload/chunk", {
                    identifier: md5Hash,
                    chunkNumber: currentChunk + 10000,
                    chunkSize: chunkSize,
                    currentChunkSize: blob.size,
                    totalSize: file.size,
                    totalChunks: totalChunks,
                    filename: file.name
                })).then(response => {
                    console.log(response.data.uploaded)
                    //获取是否可以跳过上传该分片
                    if (response.data.skipUpload) {
                        alert('File already exists on server.');
                        return;
                    }
                    return axios.post('http://localhost:8989/upload/chunk', formData, {
                        headers: {
                            'Content-Type': 'multipart/form-data'
                        }
                    });
                }).then(response => {
                    console.log(response.data);
                    if (++currentChunk < totalChunks) {
                        uploadChunk();
                    } else {
                        alert('File upload completed!');
                    }
                }).catch(error => {
                    console.error('Error uploading file:', error);
                });
            };
            uploadChunk();
        };
    }


    function createCheckUrl(baseURL, params) {
        return baseURL + "?" + tansParams(params);
    }


    function tansParams(params) {
        let result = ''
        for (const propName of Object.keys(params)) {
            const value = params[propName]
            var part = encodeURIComponent(propName) + '='
            if (value !== null && value !== '' && typeof (value) !== 'undefined') {
                if (typeof value === 'object') {
                    for (const key of Object.keys(value)) {
                        if (value[key] !== null && value[key] !== '' && typeof (value[key]) !== 'undefined') {
                            let params = propName + '[' + key + ']'
                            var subPart = encodeURIComponent(params) + '='
                            result += subPart + encodeURIComponent(value[key]) + '&'
                        }
                    }
                } else {
                    result += part + encodeURIComponent(value) + '&'
                }
            }
        }
        return result
    }

</script>
</body>
</html>
