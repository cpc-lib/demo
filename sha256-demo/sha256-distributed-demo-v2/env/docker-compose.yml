services:
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/redis:7.2-alpine
    container_name: sha256-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/mysql:8.4
    container_name: sha256-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-demo
      MYSQL_DATABASE: sha256_demo
      MYSQL_USER: sha256
      MYSQL_PASSWORD: sha256-demo
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1  -uroot -proot-demo --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: sha256-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sha256minio
      MINIO_ROOT_PASSWORD: sha256-minio-secret
      # Demo 环境允许浏览器使用预签名 URL 直接 PUT 分片。生产环境请限制为实际前端 Origin。
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/rabbitmq:3.13-management
    container_name: sha256-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sha256
      RABBITMQ_DEFAULT_PASS: sha256-demo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/kafka:4.3.1
    container_name: sha256-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 8s
      timeout: 5s
      retries: 30

volumes:
  redis_data:
  mysql_data:
  minio_data:
  rabbitmq_data:
  kafka_data:
