server:
  port: 8080

logging:
  level:
    root: INFO


canal:
  mode: simple
  server: ${CANAL_SERVER:127.0.0.1:11111}
  destination: example
  user-name: canal
  password: ${CANAL_PASSWORD:}
  batch-size: 1
  timeout: 1
  filter: "testdb\\.t_user"   # 可选：只订阅某张表
  async: true               # 默认 true
