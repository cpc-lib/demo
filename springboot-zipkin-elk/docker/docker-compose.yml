version: '3.5'
services:
  elasticsearch:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/elasticsearch:7.17.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  logstash:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/logstash:7.17.3
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  kibana:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/kibana:7.17.3
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  zipkin:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/zipkin:3.5
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - zipkin-net

networks:
  zipkin-net:
    driver: bridge