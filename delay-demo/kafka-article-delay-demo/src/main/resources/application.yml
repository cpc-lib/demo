server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://192.168.220.200:3306/article_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: cpc!23#@
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: 192.168.220.200:9092
    consumer:
      group-id: article-delay-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
