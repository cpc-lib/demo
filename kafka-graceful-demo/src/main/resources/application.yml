server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: demo-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 60000
    listener:
      ack-mode: manual
