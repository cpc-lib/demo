server:
  port: 8080 #tomcat的默认端口号
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    virtual-host: /root
    username: root
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        retry:
          enable: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 9000
          multiplier: 3
    publisher-confirm-type: correlated
    publisher-returns: true
