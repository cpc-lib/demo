server:
  port: 18080

spring:
  application:
    name: gray-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.200:3306/gray_release?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: gray
    password: gray123456
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.200:8848
      config:
        server-addr: 192.168.1.200:8848
        import-check:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

gray:
  security:
    jwt-secret: ${GRAY_JWT_SECRET:gray-release-platform-change-me-32bytes}
    expire-seconds: 86400
  alert:
    webhook-url: ${GRAY_ALERT_WEBHOOK_URL:}
  release:
    auto-advance-delay-ms: 30000
