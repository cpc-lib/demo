  prometheus:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/prometheus:v2.55.1
    container_name: gray-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      gray-admin:
        condition: service_started
      gray-gateway:
        condition: service_started

  grafana:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/grafana:11.4.0
    container_name: gray-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123456
    ports:
      - "13000:3000"
    volumes:
      - gray-grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  gray-mysql-data:
  gray-redis-data:
  gray-grafana-data:
