global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gray-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gray-admin:18080"]

  - job_name: gray-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gray-gateway:18000"]

  - job_name: demo-order-v1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-order-v1:18081"]

  - job_name: demo-order-v2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-order-v2:18082"]
