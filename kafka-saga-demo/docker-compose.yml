version: '3.8'

services:
  zookeeper:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1

      # ---- ZK 配置 ----
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # ---- 广播地址（外部访问用 localhost:9092）----
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.220.200:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      # ---- 单节点必须全部为 1 ----
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 是否允许自动创建 topic（建议 true）
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # JVM 内存可按需调整
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
