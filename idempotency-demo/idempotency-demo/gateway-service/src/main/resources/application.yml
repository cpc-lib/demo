server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: caller-service
              uri: lb://caller-service
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
                # Demo intentionally retries POST once.
                - name: Retry
                  args:
                    retries: 1
                    statuses: INTERNAL_SERVER_ERROR
                    methods: POST
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 100ms
                      factor: 1
                      basedOnPreviousValue: false
