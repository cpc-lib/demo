# =============================================================================
# Windows 本机原生 nginx 测试配置（区别于 idempotency-env-v1/infra/nginx/nginx.conf 的 Docker 版）
#
# 与 Docker 版的三处差异：
#   1. upstream 指向 127.0.0.1:8080 —— 三个 Java 服务直接跑在 Windows 本机，
#      不再需要 host.docker.internal；
#   2. root 指向本机 frontend/dist 的绝对路径 —— Windows 路径必须用正斜杠 /；
#   3. 完整独立配置（含 worker/events/http 块）—— Windows 版 nginx 直接读取
#      <nginx目录>/conf/nginx.conf，默认没有 conf.d include 机制。
#
# 用法：
#   1. 先构建前端：cd frontend && npm install && npm run build
#   2. 把本文件内容覆盖到 <nginx目录>/conf/nginx.conf（root 路径按实际位置调整）
#   3. 在 <nginx目录> 下执行：
#        start nginx        # 后台启动
#        nginx -s reload    # 修改配置后热重载
#        nginx -s quit      # 优雅停止（nginx -s stop 立即停止）
#   4. 确保后端已启动（Gateway:8080 / caller:8081 / order:8082）
#   5. 浏览器访问 http://localhost/ —— 即前端测试控制台，
#      页面里的「Nginx 全链路」即：浏览器 → 本 nginx:80 → Gateway:8080 → ...
#
# 若 80 端口被占用（IIS/其他服务），把下面 listen 80 改成如 listen 8088，
# 并用 http://localhost:8088/ 访问。
# =============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream gateway_upstream {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Vue 测试控制台构建产物（frontend/dist），按实际路径调整，必须用正斜杠
        root "release/idem-demo";
        index index.html;

        # API 请求反代到 Gateway，与 Docker 版保持相同的 header 语义
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Trace ID：每次 Nginx 请求生成一次，upstream 重试期间保持稳定。
            # 只用于链路追踪，不是业务幂等键。
            proxy_set_header X-Request-Id $request_id;

            # 业务幂等键：原样透传客户端从 POST /api/idempotency/order-create
            # 拿到的 requestId，重试期间绝不重新生成。
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            # 安全默认：upstream 失败时不重试非幂等的 POST/PATCH。
            # 只要保持同一个 Idempotency-Key，即使改成 non_idempotent 应用层仍幂等。
            proxy_next_upstream error timeout http_502 http_503 http_504;

            proxy_pass http://gateway_upstream;
        }

        # Vue SPA 前端路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
