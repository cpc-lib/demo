upstream gateway_upstream {
  server host.docker.internal:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API requests: proxied to the Gateway with the same header rules as before.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Trace ID: generated once for this Nginx request and stays stable across
    # Nginx upstream retries. It is NOT the business idempotency key.
    proxy_set_header X-Request-Id $request_id;

    # Business idempotency key: preserve exactly what client obtained from
    # POST /api/idempotency/order-create. Never regenerate during retry.
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;

    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Safe default: do not retry non-idempotent POST/PATCH just because upstream failed.
    # The application is still idempotent even if an operator later enables
    # non_idempotent, provided the same Idempotency-Key is preserved.
    proxy_next_upstream error timeout http_502 http_503 http_504;

    proxy_pass http://gateway_upstream;
  }

  # Vue test console (frontend/dist is mounted at /usr/share/nginx/html).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
