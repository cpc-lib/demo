server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.200:8848
    gateway:
      server:
        webflux:
          routes:
            # Backend issues the idempotency requestId directly from order-service.
            - id: idempotency-token-service
              uri: lb://order-service
              predicates:
                - Path=/api/idempotency/**
              filters:
                - StripPrefix=1

            - id: caller-service
              uri: lb://caller-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
                # Demo intentionally retries POST once to prove the same key is replay-safe.
                - name: Retry
                  args:
                    retries: 1
                    statuses: INTERNAL_SERVER_ERROR
                    methods: POST
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 100ms
                      factor: 1
                      basedOnPreviousValue: false
