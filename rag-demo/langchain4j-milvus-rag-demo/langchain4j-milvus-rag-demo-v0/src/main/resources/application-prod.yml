rag:
  llm:
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api-key: ${LLM_API_KEY:}
    model: "qwen-plus"
    temperature: 0.2

  embedding:
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api-key: ${LLM_API_KEY:}
    model: "text-embedding-v4"
    dimension: 1024

  milvus:
    host: "${MILVUS_HOST:127.0.0.1}"
    port: 19530
    collection: "demo_kb"
    top-k: 6
    min-score: 0.55

  splitter:
    chunk-size: 900
    overlap: 120