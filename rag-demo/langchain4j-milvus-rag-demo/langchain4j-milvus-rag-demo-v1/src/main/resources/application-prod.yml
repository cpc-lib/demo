rag:
  llm:
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api-key: ${LLM_API_KEY:}
    model: "qwen-plus"
    temperature: 0.2

  embedding:
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api-key: ${LLM_API_KEY:}
    model: "text-embedding-v4"
    dimension: 1024

  milvus:
    username: ${MILVUS_USERNAME:}
    password: ${MILVUS_PASSWORD:}
    default-alias: "default"
    host: "${MILVUS_HOST:127.0.0.1}"
    port: 19530
    collection: "demo_kb"
    top-k: 6
    min-score: 0.55

  splitter:
    chunk-size: 900
    overlap: 120

tavily:
  api:
    key: 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

spring:
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: 6379
      database: 0
      timeout: 5s
      password: ${REDIS_PASSWORD:}
