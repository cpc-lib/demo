server:
  port: 18083
spring:
  application:
    name: elasticjob-order-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/order_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
elasticjob:
  reg-center:
    server-lists: ${ZOOKEEPER_SERVER:127.0.0.1:2181}
    namespace: order-timeout-job
order:
  job:
    batch-size: 100
