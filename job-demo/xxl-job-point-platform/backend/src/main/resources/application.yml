server:
  port: ${SERVER_PORT:8088}
spring:
  application:
    name: point-reward-service
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.1.200:3308/point_reward?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cpc!23#@}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.1.200:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.points.domain
    listener:
      ack-mode: record
xxl:
  job:
    admin:
      # 本地 IDEA 启动的 xxl-job-admin 3.1.1 自带 context-path /xxl-job-admin（3.4.1 起才移除），
      # 因此地址必须带上该前缀；若改用 docker-compose 的 3.4.2 admin，则用 http://localhost:8080
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8080/xxl-job-admin}
      timeout: 3
    executor:
      enabled: true
      appname: point-reward-executor
      accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      logpath: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      logretentiondays: 30
