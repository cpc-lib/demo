name: powerjob-439-fixed

services:
  powerjob-mysql:
    image: mysql:8.0.36
    container_name: powerjob-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${POWERJOB_DB_NAME}
      MYSQL_USER: ${POWERJOB_DB_USER}
      MYSQL_PASSWORD: ${POWERJOB_DB_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - powerjob-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - powerjob-network

  powerjob-server:
    image: powerjob/powerjob-server:4.3.9
    container_name: powerjob-server
    restart: unless-stopped
    depends_on:
      powerjob-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JVMOPTIONS: >-
        ${POWERJOB_JVM_OPTIONS}
        -Dpowerjob.network.external.address=${POWERJOB_EXTERNAL_ADDRESS}
        -Dpowerjob.network.external.port.http=${POWERJOB_HTTP_HOST_PORT:-10010}
        -Dpowerjob.network.external.port.akka=${POWERJOB_AKKA_HOST_PORT:-10086}
      PARAMS: >-
        --spring.profiles.active=product
        --oms.mongodb.enable=false
        --spring.datasource.core.jdbc-url=jdbc:mysql://powerjob-mysql:3306/${POWERJOB_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
        --spring.datasource.core.username=${POWERJOB_DB_USER}
        --spring.datasource.core.password=${POWERJOB_DB_PASSWORD}
        --spring.datasource.core.maximum-pool-size=20
        --spring.datasource.core.minimum-idle=5
    ports:
      - "${POWERJOB_WEB_HOST_PORT:-7700}:7700"
      - "${POWERJOB_HTTP_HOST_PORT:-10010}:10010"
      - "${POWERJOB_AKKA_HOST_PORT:-10086}:10086"
    volumes:
      - powerjob-server-data:/root/powerjob/server
    networks:
      - powerjob-network

networks:
  powerjob-network:
    name: powerjob-network
    driver: bridge

volumes:
  powerjob-mysql-data:
    name: powerjob-mysql-data
  powerjob-server-data:
    name: powerjob-server-data
