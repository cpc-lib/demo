spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:order_close_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql

powerjob:
  worker:
    enabled: false
