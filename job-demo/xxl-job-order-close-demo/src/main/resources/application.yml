server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: xxl-job-order-close-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.220.200:3306/order_demo_v2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
      validation-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:true}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:xxl-order-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:./logs/xxl-job}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
      excludedpackage: ${XXL_JOB_EXECUTOR_EXCLUDED_PACKAGE:org.springframework,spring}

logging:
  level:
    root: INFO
    com.example.orderclose: INFO
