server:
  port: 8082

spring:
  application:
    name: storage-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/seata_storage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    locations: classpath:db/migration
    validate-on-migrate: true

dubbo:
  application:
    name: storage-service
    qos-port: 22223
  protocol:
    name: dubbo
    port: 20882
  registry:
    id: nacos-registry
    address: nacos://127.0.0.1:8848
  provider:
    timeout: 10000
    retries: 0 # 分布式事务场景下，RPC 建议默认 retries=0，防止因网络超时引起非幂等重试

seata:
  enabled: true
  application-id: storage-service
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
  config:
    type: file
  # 开启数据源自动代理 (AT 模式默认启用)
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT # 当需要全局跑 XA 模式测试时可切换为 XA

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
