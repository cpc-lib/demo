server:
  port: 8090
  tomcat:
    max-connections: 4000
    accept-count: 1000
    threads:
      max: 800
      min-spare: 10
    uri-encoding: UTF-8

spring:
  servlet:
    multipart:
      enabled: true #是否启用http上传处理
      max-file-size: 50MB #设置单个文件最大长度
      max-request-size: 50MB #最大请求文件的大小

  #在 Spring Boot 2.6.x 及更高版本中，spring.resources.static-locations 已被废弃，
  #推荐使用 spring.web.resources.static-locations 作为替代配置项
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.200:3308/test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: cpc!23#@
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true