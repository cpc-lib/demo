server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
      password: ${REDIS_PASSWORD:}
      database: 0

dubbo:
  application:
    name: dubbo-limit-demo
  protocol:
    name: dubbo
    port: 20880
    host: 127.0.0.1
  registry:
    #address: N/A
    address: nacos://127.0.0.1:8848
    username: nacos
    password: ${NACOS_PASSWORD:}