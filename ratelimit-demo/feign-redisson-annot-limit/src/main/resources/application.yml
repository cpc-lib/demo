server:
  port: 8080

spring:
  application:
    name: feign-redisson-annot-limit
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:}

external:
  api:
    base-url: http://localhost:8080/api

redisson:
  config: |
    singleServerConfig:
      address: "redis://127.0.0.1:6379"
      password: ${REDIS_PASSWORD:}
      database: 0
