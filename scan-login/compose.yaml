services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: scan_login
      MYSQL_USER: scan
      MYSQL_PASSWORD: scan_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_dev_password" ]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
  redis_data:
