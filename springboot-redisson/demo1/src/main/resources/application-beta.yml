#sentinel模式
spring:
  redis:
    timeout: 3000
    sentinel:
      master: mymaster
      nodes:
        - ${REDIS_HOST:127.0.0.1}:27001
        - ${REDIS_HOST:127.0.0.1}:27002
        - ${REDIS_HOST:127.0.0.1}:27003
      password:
    lettuce:
      pool:
        enabled: true
        max-idle: 100
        min-idle: 1
        max-active: 10
        max-wait: 5000