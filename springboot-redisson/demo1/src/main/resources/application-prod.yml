# 集群模式
spring:
  redis:
    timeout: 3000
    cluster:
      nodes:
        - ${REDIS_HOST:127.0.0.1}:7001
        - ${REDIS_HOST:127.0.0.1}:7002
        - ${REDIS_HOST:127.0.0.1}:7003
        - ${REDIS_HOST:127.0.0.1}:8001
        - ${REDIS_HOST:127.0.0.1}:8002
        - ${REDIS_HOST:127.0.0.1}:8003
    # redis服务数据库下标
    database: 0
    password:
    lettuce:
      pool:
        enabled: true
        max-idle: 100
        min-idle: 1
        max-active: 10
        max-wait: 5000