server:
  port: 8080
spring:
  servlet:
    multipart:
      #开启文件上传
      enabled: true
      #限制文件上传大小为50M
      max-file-size: 50MB
# MinIO对象存储相关配置
minio:
  #MinIO服务所在地址
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  #存储桶名称
  bucketName: ruoyi
  #访问的key
  accessKey: ${MINIO_ACCESS_KEY:}
  #访问的秘钥
  secretKey: ${MINIO_SECRET_KEY:}
