server:
  port: 8080 #服务端口

spring:
  application:
    name: payment-demo #应用的名字

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379
    database: 0
    timeout: 3000ms
    password: ${REDIS_PASSWORD:}

  datasource:
    # 达梦 DM8：默认由 docker-compose.dm8.yml 暴露到本机 5236
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:127.0.0.1}:${DM_PORT:5236}?schema=${DM_SCHEMA:SYSDBA}&connectTimeout=30000
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:}

mybatis-plus:
  configuration: #sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    root: info


payment:
  order:
    close-delay-ms: 60000
  refund:
    status-sync-delay-ms: 60000
  reconciliation:
    schedule:
      enabled: false
      cron: "0 30 10 * * ?"
    retry-delay-ms: 300000
    feature:
      enabled: true
