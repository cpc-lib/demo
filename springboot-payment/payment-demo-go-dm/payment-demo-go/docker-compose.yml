name: payment-demo-dameng

services:
  dm8:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/dm8:latest
    container_name: payment-demo-dm8
    restart: unless-stopped
    privileged: true

    environment:
      TZ: Asia/Shanghai

      # SYSDBA 密码：达梦要求 9-48 位
      # 原密码 cpc!23#@ 只有 8 位，会导致 initdb failed
      SYSDBA_PWD: "Cpc2026#@Dm"

      # 达梦运行环境
      LD_LIBRARY_PATH: /opt/dmdbms/bin

      # 初始化参数：首次创建数据卷时生效
      PAGE_SIZE: "16"
      EXTENT_SIZE: "32"
      LOG_SIZE: "1024"

      # 字符集：1 = UTF-8
      CHARSET: "1"
      UNICODE_FLAG: "1"

      # 0 = 大小写不敏感
      CASE_SENSITIVE: "0"

      # 1 = VARCHAR 长度按字符计算
      LENGTH_IN_CHAR: "1"

      INSTANCE_NAME: "DMSERVER"

    ports:
      - "5236:5236"

    volumes:
      - dm8-data:/opt/dmdbms/data

    shm_size: 1g

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536

    networks:
      - payment-demo-net

volumes:
  dm8-data:
    driver: local

networks:
  payment-demo-net:
    driver: bridge