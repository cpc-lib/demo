name: payment-demo-dameng

services:
  dm8:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/dm8:latest
    container_name: payment-demo-dm8
    restart: unless-stopped
    privileged: true

    environment:
      TZ: Asia/Shanghai

      # SYSDBA 密码：达梦要求 9-48 位
      SYSDBA_PWD: "Cpc2026#@Dm"

      # 达梦运行环境
      LD_LIBRARY_PATH: /opt/dmdbms/bin

      # 初始化参数：首次创建数据卷时生效
      PAGE_SIZE: "16"
      EXTENT_SIZE: "32"
      LOG_SIZE: "1024"

      # 字符集：1 = UTF-8
      CHARSET: "1"
      UNICODE_FLAG: "1"

      # 0 = 大小写不敏感
      CASE_SENSITIVE: "0"

      # 1 = VARCHAR 长度按字符计算
      LENGTH_IN_CHAR: "1"

      INSTANCE_NAME: "DMSERVER"

    ports:
      - "5236:5236"

    volumes:
      - dm8-data:/opt/dmdbms/data

    shm_size: 1g

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536

    networks:
      - payment-demo-net

  # 数据库初始化服务：等待达梦就绪后执行 SQL 初始化脚本
  db-init:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/dm8:latest
    container_name: payment-demo-db-init
    restart: "no"

    environment:
      TZ: Asia/Shanghai
      LD_LIBRARY_PATH: /opt/dmdbms/bin
      DM_HOST: dm8
      DM_PORT: "5236"
      DM_USER: SYSDBA
      DM_PWD: "Cpc2026#@Dm"
      SQL_FILE: /sql/payment_demo.sql

    volumes:
      # 挂载 env/sql 目录（含 SQL 文件和初始化脚本）
      - ./sql:/sql:ro

    depends_on:
      - dm8

    # 等待达梦就绪并执行 SQL 初始化
    entrypoint: ["/bin/bash", "/sql/init-db.sh"]

    networks:
      - payment-demo-net

  redis:
    image: redis:7-alpine
    container_name: payment-demo-redis
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai

    # 与 application.yml 中 redis.password 保持一致
    command: redis-server --requirepass "cpc!23#@"

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - payment-demo-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payment-demo-rabbitmq
    restart: unless-stopped

    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      # AMQP 协议端口
      - "5672:5672"
      # 管理界面端口
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - payment-demo-net

volumes:
  dm8-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  payment-demo-net:
    driver: bridge
