server:
  port: 8080 #服务端口

spring:
  application:
    name: payment-demo #应用的名字

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379
    database: 0
    timeout: 3000ms
    password: ${REDIS_PASSWORD:}

  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:127.0.0.1}:${DM_PORT:5236}?schema=PAYMENT_DEMO&connectTimeout=30000
    username: SYSDBA
    password: ${DM_PASSWORD:}

mybatis-plus:
  configuration: #sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    root: info


payment:
  order:
    close-delay-ms: 60000
