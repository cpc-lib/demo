server:
  port: 8080 #服务端口

spring:
  application:
    name: payment-demo #应用的名字

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: 192.168.220.200
    port: 5672
    username: guest
    password: guest

  redis:
    host: 192.168.220.200
    port: 6379
    database: 0
    timeout: 3000ms
    password: cpc!23#@

  servlet:
    multipart: #手动上传渠道账单文件大小限制
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://192.168.220.200:3308/payment_demo_v1?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false
    username: root
    password: cpc!23#@

mybatis-plus:
  configuration: #sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    root: info


payment:
  order:
    close-delay-ms: 60000
  refund:
    status-sync-delay-ms: 60000
  reconciliation:
    enabled: true
    #渠道账单T+1出账：微信昨日账单次日10:00后生成，定时任务先导入账单再对账
    wx-cron: 0 30 10 * * ?
    ali-cron: 0 0 11 * * ?
